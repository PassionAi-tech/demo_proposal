<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6dfe2">
<title>For you ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display&display=swap');
:root{--wine:#722f40;--wine2:#8e4657;--rose:#e8a6ae;--paper:#fff7f5;--cream:#fffaf4;--muted:#956a73;--line:#d49ba4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--wine)}
body{font-family:Georgia,serif;overflow-x:hidden;background:#f7e4e5;background-image:linear-gradient(45deg,rgba(255,255,255,.48) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.48) 75%),linear-gradient(45deg,rgba(255,255,255,.48) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.48) 75%);background-position:0 0,14px 14px;background-size:28px 28px}
button,input{font:inherit}.app{min-height:100svh;display:grid;place-items:center;padding:18px 14px}.shell{width:min(100%,455px);min-height:740px;position:relative;filter:drop-shadow(0 24px 35px rgba(91,45,55,.17))}
.paper{position:relative;min-height:740px;padding:64px 27px 40px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);border:1px solid rgba(114,47,64,.14);clip-path:polygon(1% 2%,8% 1%,16% 2%,24% 1%,34% 2%,44% 1%,54% 2%,64% 1%,74% 2%,84% 1%,98% 3%,97% 14%,99% 25%,97% 35%,99% 46%,97% 57%,99% 69%,97% 80%,99% 91%,96% 98%,86% 97%,76% 99%,66% 97%,55% 99%,45% 97%,34% 99%,23% 97%,13% 99%,2% 97%,3% 87%,1% 77%,3% 66%,1% 55%,3% 44%,1% 33%,3% 22%,1% 12%)}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 20%,rgba(232,166,174,.23),transparent 25%),radial-gradient(circle at 90% 82%,rgba(218,163,199,.18),transparent 30%)}
.flower{position:absolute;right:15px;top:11px;font-size:56px;filter:saturate(.8);transform:rotate(12deg);z-index:2}.corner{position:absolute;left:18px;bottom:17px;font-size:31px;opacity:.65;transform:rotate(-12deg)}
.music{position:absolute;right:22px;top:26px;z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid rgba(114,47,64,.18);background:rgba(255,255,255,.62);color:var(--wine);cursor:pointer;font-size:19px;box-shadow:0 5px 15px rgba(114,47,64,.1)}
.dots{position:absolute;top:31px;left:24px;z-index:4;display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#dfc4c8;transition:.3s}.dot.on{width:18px;border-radius:8px;background:var(--wine2)}
#root{width:100%;position:relative;z-index:3}.page{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:pageIn .65s cubic-bezier(.2,.8,.2,1)}@keyframes pageIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.script{font-family:Caveat,cursive;font-size:30px;font-weight:600;line-height:1.05;color:var(--wine2)}.title{font-family:'DM Serif Display',Georgia,serif;font-size:43px;line-height:1.03;margin:12px 0 16px;color:var(--wine)}.big{font-family:Caveat,cursive;font-size:68px;line-height:.9;margin:10px 0 18px;color:#873c4d}.sub{font-size:16px;line-height:1.6;color:var(--muted);max-width:320px}.tiny{font-family:Caveat,cursive;font-size:23px;color:#ad737e;margin-top:17px}
.character{font-size:80px;margin-bottom:8px;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 8px 9px rgba(110,45,58,.1))}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}
.btn{font-family:Caveat,cursive;font-size:27px;color:var(--wine);background:#fffaf6;border:1.5px solid var(--line);border-radius:12px;padding:8px 27px;min-width:124px;cursor:pointer;box-shadow:0 5px 0 rgba(114,47,64,.1);transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-3px)}.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(114,47,64,.1)}.primary{background:linear-gradient(135deg,#f5d5d9,#edb5bd)}.row{display:flex;gap:13px;justify-content:center;align-items:center;margin-top:27px;width:100%;min-height:72px}
.no{background:#fff}.no:focus{outline:none}.seal{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px;border:1px solid #d99fa7;background:#f8dfe2;font-size:45px;box-shadow:inset 0 0 0 7px #fff5f4,0 9px 20px rgba(114,47,64,.1)}
.reasons{width:100%;display:grid;gap:9px;margin-top:14px}.reason{padding:10px 13px;text-align:left;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(142,70,87,.14);font-family:Caveat,cursive;font-size:20px;color:#7d3b4b}.letter{padding:19px 18px;margin-top:20px;border:1px solid rgba(142,70,87,.2);border-radius:15px;background:rgba(255,255,255,.55);font-family:Caveat,cursive;font-size:24px;line-height:1.22;color:#82404f;box-shadow:0 10px 25px rgba(114,47,64,.06)}
.grid{width:100%;display:grid;gap:14px;margin-top:22px}.field{text-align:left}.field span{display:block;font-family:Caveat,cursive;font-size:22px;margin-bottom:5px}.field input{width:100%;padding:13px 14px;border:1px solid #d2a0a8;border-radius:11px;background:#fffaf8;color:var(--wine);font-size:16px;outline:none}.field input:focus{border-color:var(--wine2);box-shadow:0 0 0 3px rgba(142,70,87,.09)}
.place{display:flex;align-items:center;gap:10px;padding:14px;border-radius:13px;background:#f8e1e3;border:1px dashed #c88b96;font-family:Caveat,cursive;font-size:26px}.place small{display:block;font:14px Georgia;color:#96636d;margin-top:2px}
.plan-card{width:100%;margin-top:21px;padding:18px;border-radius:17px;background:rgba(255,255,255,.63);border:1px solid rgba(142,70,87,.17);text-align:left}.plan-card strong{font-family:Caveat,cursive;font-size:25px}.plan-line{display:flex;gap:11px;align-items:center;margin:9px 0;color:#875866}
.progress{font-family:Caveat,cursive;color:#aa707b;font-size:19px;margin-top:18px}.share{font-family:Caveat,cursive;color:#a46b76;font-size:21px;margin-top:10px}.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.petal{position:absolute;top:-30px;font-size:18px;animation:fall linear forwards;opacity:.8}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#6f2d3e;color:white;padding:10px 16px;border-radius:999px;font:17px Caveat,cursive;z-index:30;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-height:760px){.shell,.paper{min-height:690px}.title{font-size:38px}.big{font-size:59px}.character{font-size:70px}.paper{padding-top:58px}}
</style>
</head>
<body>
<div class="app"><main class="shell"><div class="paper">
<div class="flower">🌸</div><div class="corner">🌷</div>
<div class="dots" id="dots"></div><button class="music" id="music">♫</button>
<div id="root"></div>
</div></main></div><div class="petals" id="petals"></div><div class="toast" id="toast"></div>
<script>
const root=document.getElementById('root'),dots=document.getElementById('dots'),music=document.getElementById('music'),toast=document.getElementById('toast');
let step=1,noCount=0,audio=null,playing=false,timer;
function setDots(){dots.innerHTML='';for(let i=1;i<=5;i++){const d=document.createElement('i');d.className='dot '+(i<=step?'on':'');dots.appendChild(d)}}
function go(n,fn){step=n;setDots();fn()}
function pageOne(){go(1,()=>root.innerHTML=`
<section class="page">
<div class="character">🐻</div>
<div class="script">hey... I made something</div>
<div class="big">I wanted to<br>say something ♡</div>
<p class="sub">There are some things that are much nicer to say properly than to type in a random chat.</p>
<button class="btn primary" style="margin-top:28px" id="say">say!!</button>
<div class="tiny">tap when you're ready ✦</div>
</section>`);document.getElementById('say').onclick=pageTwo}
function pageTwo(){go(2,()=>root.innerHTML=`
<section class="page">
<div class="seal">♡</div>
<div class="script">okay... deep breath</div>
<div class="big">I love you.</div>
<div class="letter">I didn't want to make this a giant paragraph or a boring text. I just wanted you to know how I feel — properly.</div>
<div class="reasons"><div class="reason">♡ You became someone I genuinely care about.</div><div class="reason">♡ Talking to you can make an ordinary day feel better.</div><div class="reason">♡ Somehow, you became really special to me.</div></div>
<button class="btn primary" style="margin-top:25px" id="next">there's more →</button>
</section>`);document.getElementById('next').onclick=pageThree}
function pageThree(){go(3,()=>root.innerHTML=`
<section class="page">
<div class="character">🧸</div>
<div class="script">and now... the important question</div>
<div class="title">Will you go on a date with me?</div>
<p class="sub">No pressure at all. I mean that. I just wanted to ask you properly.</p>
<div class="row"><button class="btn primary" id="yes">yes!! ♡</button><button class="btn no" id="no">no</button></div>
<div class="progress">choose honestly ♡</div>
</section>`);document.getElementById('yes').onclick=pageFour;document.getElementById('no').onclick=playfulNo}
function playfulNo(){noCount++;const y=document.getElementById('yes'),n=document.getElementById('no');y.style.transform='scale('+Math.min(1+noCount*.12,1.5)+')';n.style.transform='translate('+((Math.random()*80)-40)+'px,'+((Math.random()*48)-24)+'px)';if(noCount===1)showToast('okay, I respect that ♡');if(noCount===2)showToast('no really means no — promise ♡');if(noCount>=3){n.style.transform='none';n.textContent='no ♡';y.style.transform='scale(1)';}}
function pageFour(){burst();go(4,()=>root.innerHTML=`
<section class="page">
<div class="seal">🌷</div>
<div class="script">yay... then let's make it simple</div>
<div class="big" style="font-size:54px">Let's plan a date.</div>
<p class="sub">One day, one place, no complicated stuff.</p>
<div class="grid">
<label class="field"><span>When?</span><input id="date" type="date"></label>
<div class="field"><span>Where?</span><div class="place">🛕 <div><strong>Krishna Temple</strong><small>A peaceful little visit together.</small></div></div></div>
</div>
<button class="btn primary" style="margin-top:22px" id="finish">make our plan ♡</button>
</section>`);const input=document.getElementById('date');input.min=new Date().toISOString().split('T')[0];document.getElementById('finish').onclick=finish}
function finish(){const d=document.getElementById('date').value;const pretty=d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}):'a day we choose together';burst();go(5,()=>root.innerHTML=`
<section class="page">
<div class="seal">💗</div>
<div class="script">and that's the plan...</div>
<div class="big" style="font-size:55px">It's a date ♡</div>
<div class="plan-card">
<div class="plan-line">📅 <span><strong>${esc(pretty)}</strong></span></div>
<div class="plan-line">🛕 <span><strong>Krishna Temple</strong></span></div>
</div>
<div class="letter">The website was the easy part. Getting to spend time together is the part I'm actually excited about.</div>
<div class="tiny">♡ see you then ♡</div><div class="share">made with way too much effort, just for you ♡</div>
<button class="btn" style="margin-top:20px" id="replay">replay</button>
</section>`);document.getElementById('replay').onclick=()=>{noCount=0;pageOne()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function burst(){const b=document.getElementById('petals');for(let i=0;i<45;i++){const e=document.createElement('i');e.className='petal';e.textContent=['🌸','♡','✦','🌷'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(1.7+Math.random()*1.7)+'s';e.style.animationDelay=Math.random()*.35+'s';b.appendChild(e);setTimeout(()=>e.remove(),3800)}}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function toggleMusic(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(playing){clearInterval(timer);playing=false;music.textContent='♫';showToast('music off');return}playing=true;music.textContent='🔇';showToast('soft music on');const notes=[261.63,329.63,392,329.63,293.66,349.23,392];let i=0;timer=setInterval(()=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.028,audio.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.38);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.4)},480)}
music.onclick=toggleMusic;setDots();pageOne();
</script>
</body>
</html>
