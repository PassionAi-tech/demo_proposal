<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dfe2">
<title>Something for you ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display&display=swap');
:root{--ink:#6f2938;--soft:#fff7f6;--pink:#e8a4ad;--deep:#9c5362;--line:#c98995}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;color:var(--ink)}
body{overflow-x:hidden;background-color:#f8e7e7;background-image:linear-gradient(90deg,rgba(255,255,255,.48) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.48) 50%,transparent 50%);background-size:28px 28px}
.app{min-height:100svh;display:grid;place-items:center;padding:22px 16px}.shell{width:min(100%,450px);min-height:720px;position:relative;overflow:hidden;border-radius:30px;display:flex;align-items:center;justify-content:center}
.paper{width:100%;min-height:680px;padding:70px 30px 48px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff4f2;border:1px solid rgba(160,91,103,.18);box-shadow:0 18px 45px rgba(104,52,61,.18);clip-path:polygon(2% 2%,8% 1%,16% 2%,25% 1%,34% 2%,43% 1%,53% 2%,62% 1%,71% 2%,80% 1%,91% 2%,98% 4%,97% 14%,99% 23%,97% 34%,99% 44%,97% 55%,99% 65%,97% 76%,99% 87%,97% 98%,87% 97%,77% 99%,66% 97%,56% 99%,45% 97%,35% 99%,24% 97%,14% 99%,3% 97%,4% 87%,2% 77%,4% 67%,2% 57%,4% 47%,2% 36%,4% 26%,2% 16%)}
.flower{position:absolute;right:20px;top:18px;font-size:58px;transform:rotate(12deg);opacity:.9}.music{position:absolute;right:24px;top:28px;z-index:5;width:45px;height:45px;border-radius:50%;border:1px solid rgba(111,41,56,.18);background:rgba(255,255,255,.6);color:var(--ink);font-size:20px;cursor:pointer}
.page{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:in .55s ease}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.script{font-family:Caveat,cursive;font-size:31px;font-weight:600;line-height:1.1}.title{font-family:'DM Serif Display',Georgia,serif;font-size:44px;line-height:1.02;margin:14px 0;color:#7b3140}.bigscript{font-family:Caveat,cursive;font-size:64px;line-height:.95;margin:10px 0 18px;color:#8b3d4d}
.sub{font-size:17px;line-height:1.55;color:#875b64;max-width:315px;margin:0 auto}.tiny{font-family:Caveat,cursive;font-size:23px;color:#a86c77;margin-top:18px}
.cat{font-size:76px;margin-bottom:12px;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
.btn{font-family:Caveat,cursive;font-size:26px;color:var(--ink);background:#fffaf6;border:1.5px solid var(--line);border-radius:11px;padding:8px 28px;min-width:120px;box-shadow:0 4px 0 rgba(111,41,56,.1);cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px);box-shadow:none}
.row{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:28px;min-height:68px;width:100%}.yes{background:#f5d6d9}.no{background:#fff}
.no.moving{position:relative}
.grid{width:100%;display:grid;gap:12px;margin-top:25px}.field{text-align:left}.field span{display:block;font-family:Caveat,cursive;font-size:21px;margin:0 0 4px}.field input{width:100%;padding:12px 14px;border:1px solid #d3a2aa;border-radius:10px;background:#fffaf8;color:var(--ink);font:17px Georgia}.place{padding:15px;border-radius:13px;background:#f7e0e2;border:1px dashed #c88995;font-family:Caveat,cursive;font-size:25px;margin-top:6px}.heart{font-size:55px;margin-bottom:8px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-15px;width:7px;height:11px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}
@media(max-height:760px){.paper{min-height:650px;padding-top:58px}.title{font-size:39px}}
</style>
</head>
<body>
<div class="app"><main class="shell"><div class="paper">
<div class="flower">🌸</div><button class="music" id="music" aria-label="Toggle music">♫</button>
<div id="root"></div>
</div></main></div><div class="confetti" id="confetti"></div>
<script>
const root=document.getElementById('root'), music=document.getElementById('music');let noCount=0,audio=null,playing=false,timer;
function pageOne(){root.innerHTML=`
<section class="page">
<div class="cat">🐻</div>
<div class="script">I made something for you...</div>
<div class="bigscript">I wanted to say<br>something ♡</div>
<p class="sub">So instead of saying it in a boring message, I made you this little website.</p>
<button class="btn" style="margin-top:28px" id="say">say!!</button>
</section>`;document.getElementById('say').onclick=pageTwo}
function pageTwo(){root.innerHTML=`
<section class="page">
<div class="heart">♡</div>
<div class="script">okay... here goes</div>
<div class="bigscript">I love you.</div>
<p class="sub">I've wanted to tell you properly, and I didn't know how to put it into a normal text.</p>
<div class="tiny">so I built this instead :)</div>
<button class="btn" style="margin-top:25px" id="next">continue →</button>
</section>`;document.getElementById('next').onclick=pageThree}
function pageThree(){root.innerHTML=`
<section class="page">
<div class="cat">🐻</div>
<div class="script">one more thing...</div>
<div class="title">Will you go on a date with me?</div>
<p class="sub">No pressure. I just wanted to ask you in a way you'd remember.</p>
<div class="row"><button class="btn yes" id="yes">yes!! ♡</button><button class="btn no" id="no">no</button></div>
</section>`;document.getElementById('yes').onclick=pageFour;document.getElementById('no').onclick=playfulNo}
function playfulNo(){noCount++;const y=document.getElementById('yes'),n=document.getElementById('no');y.style.transform='scale('+Math.min(1+noCount*.13,1.55)+')';n.style.transform='translate('+((Math.random()*80)-40)+'px,'+((Math.random()*50)-25)+'px)';n.textContent=noCount<3?'no':noCount<6?'really?':'okay 😭';if(noCount>=6)n.style.opacity='.72'}
function pageFour(){burst();root.innerHTML=`
<section class="page">
<div class="heart">🌷</div>
<div class="script">yay ♡</div>
<div class="bigscript" style="font-size:51px">then it's a plan.</div>
<p class="sub">Let's keep it simple and make it a day we'll actually enjoy.</p>
<div class="grid">
<label class="field"><span>Pick a day</span><input id="date" type="date"></label>
<div class="field"><span>Where?</span><div class="place">🛕 Krishna Temple</div></div>
</div>
<button class="btn yes" style="margin-top:22px" id="finish">make the plan ♡</button>
<div class="tiny">you + me + a little Krishna temple visit</div>
</section>`;document.getElementById('finish').onclick=finish}
function finish(){const d=document.getElementById('date').value;const pretty=d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}):'a day we choose together';burst();root.innerHTML=`
<section class="page">
<div class="heart">💗</div>
<div class="script">okay...</div>
<div class="bigscript" style="font-size:50px">It's a date ♡</div>
<p class="sub"><strong>${esc(pretty)}</strong><br><br>🛕 Krishna Temple</p>
<div class="tiny">I'm really looking forward to it.</div>
<button class="btn" style="margin-top:26px" id="replay">replay</button>
</section>`;document.getElementById('replay').onclick=()=>{noCount=0;pageOne()}}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function burst(){const b=document.getElementById('confetti');for(let i=0;i<55;i++){const e=document.createElement('i');e.className='piece';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';e.style.background=['#d98996','#e9b45c','#fff','#9b7180'][Math.floor(Math.random()*4)];b.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function toggleMusic(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(playing){clearInterval(timer);playing=false;music.textContent='♫';return}playing=true;music.textContent='🔇';const notes=[261.63,329.63,392,329.63,293.66,349.23];let i=0;timer=setInterval(()=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.3);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.32)},430)}
music.onclick=toggleMusic;pageOne();
</script></body></html>
