<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090713">
<title>A little question ✦</title>
<style>
:root{--bg:#090713;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);--pink:#ff6fae;--pink2:#ff9ac8;--gold:#ffd66b;--text:#fff8fc;--muted:#c8bdc9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}.o1{width:260px;height:260px;background:#ff4f9a;top:-90px;left:-90px}.o2{width:300px;height:300px;background:#7c5cff;right:-120px;bottom:-90px}
.app{min-height:100svh;display:grid;place-items:center;padding:22px}.shell{width:min(100%,430px);min-height:720px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.screen{min-height:720px;padding:34px 24px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:in .55s ease}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.badge{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink2);font-weight:800;margin-bottom:18px}
h1{font-size:clamp(34px,9vw,52px);line-height:1.02;margin:0 0 16px;letter-spacing:-.045em}
h2{font-size:31px;margin:0 0 10px;letter-spacing:-.03em}p{color:var(--muted);line-height:1.6;margin:0 auto;max-width:330px}
.heart{font-size:72px;filter:drop-shadow(0 0 24px rgba(255,105,174,.5));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}
.actions{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:30px;min-height:74px;width:100%;position:relative}
button{border:0;font:inherit;font-weight:850;cursor:pointer;transition:transform .22s,box-shadow .22s,opacity .22s}
.yes{padding:17px 30px;border-radius:18px;color:#28101d;background:linear-gradient(135deg,var(--pink2),var(--pink));box-shadow:0 12px 35px rgba(255,92,164,.28);min-width:125px}
.yes:hover{transform:translateY(-3px) scale(1.02)}
.no{padding:14px 22px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#eee;min-width:82px}
.no:hover{transform:translateY(-2px)}
.note{font-size:12px;color:#9e92a0;margin-top:18px}.top{position:absolute;top:18px;right:18px;z-index:3}
.music{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);font-size:17px}
.grid{width:100%;display:grid;gap:12px;margin-top:22px}.field{display:flex;flex-direction:column;text-align:left;gap:7px}.field span{font-size:12px;color:#a99eac;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:14px 15px;border-radius:15px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:#fff;outline:none;font:inherit}.field textarea{resize:vertical;min-height:85px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink)}
.submit{width:100%;margin-top:18px;padding:16px;border-radius:17px;background:linear-gradient(135deg,var(--pink2),var(--pink));color:#28101d}
.confirm{margin-top:20px;padding:14px;border:1px solid rgba(255,214,107,.25);border-radius:17px;background:rgba(255,214,107,.06);color:#ffe8a5;font-size:13px;line-height:1.5}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:7px;height:12px;border-radius:2px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}
.small{font-size:13px;color:#968a99;margin-top:12px}
@media(max-height:760px){.shell,.screen{min-height:680px}.screen{padding-top:24px}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="app"><main class="shell">
<button class="music top" id="music" aria-label="Toggle music">♫</button>
<div id="root"></div>
</main></div>
<div id="confetti" class="confetti"></div>
<script>
const root=document.getElementById('root'), musicBtn=document.getElementById('music');
let noCount=0, audio=null, playing=false;

function renderStart(){
root.innerHTML=`
<section class="screen">
<div class="heart">♡</div>
<div class="badge">A tiny developer project</div>
<h1>I have a question for you.</h1>
<p>I could have just asked normally… but where's the fun in that?</p>
<div class="actions">
<button class="yes" id="yes">Yes ❤️</button>
<button class="no" id="no">No</button>
</div>
<div class="note">No pressure — choose whatever you really want.</div>
</section>`;
document.getElementById('yes').onclick=showPlanner;
document.getElementById('no').onclick=playfullyNo;
}
function playfullyNo(){
noCount++;
const y=document.getElementById('yes'), n=document.getElementById('no');
y.style.transform='scale('+Math.min(1+noCount*.14,1.75)+')';
n.style.transform='translate('+((Math.random()*90)-45)+'px,'+((Math.random()*70)-35)+'px) scale('+Math.max(.78,1-noCount*.04)+')';
n.textContent=noCount<3?'No':noCount<6?'Still no?':'No 😭';
if(noCount===1) document.querySelector('.note').textContent='Okay okay 😭 I’ll make the YES button a little more dramatic.';
}
function showPlanner(){
burst();
root.innerHTML=`
<section class="screen">
<div class="heart">✨</div>
<div class="badge">Step 2 · Your choice</div>
<h2>It's a yes! 🎉</h2>
<p>Now let's turn that yes into an actual plan.</p>
<div class="grid">
<label class="field"><span>Pick a day</span><input id="date" type="date"></label>
<label class="field"><span>What sounds fun?</span><select id="activity"><option>Food + a walk</option><option>Movie</option><option>Café + talking</option><option>Arcade / games</option><option>You choose</option></select></label>
<label class="field"><span>Any place in mind?</span><input id="place" placeholder="Your idea..."></label>
<label class="field"><span>Anything I should know?</span><textarea id="extra" placeholder="Optional"></textarea></label>
</div>
<button class="submit" id="plan">Make the plan ✦</button>
<div class="small">You can change anything before we call it a plan.</div>
</section>`;
document.getElementById('plan').onclick=finish;
}
function finish(){
const d=document.getElementById('date').value, a=document.getElementById('activity').value, p=document.getElementById('place').value||'somewhere you like';
const pretty=d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}):'a day we choose together';
root.innerHTML=`
<section class="screen">
<div class="heart">💗</div>
<div class="badge">Date plan saved</div>
<h2>Okay… it's a date.</h2>
<p><strong>${escapeHtml(pretty)}</strong><br>${escapeHtml(a)}<br>${escapeHtml(p)}</p>
<div class="confirm">The best part isn't the plan. It's getting to spend some time together.</div>
<button class="submit" id="again">Replay ✦</button>
</section>`;
document.getElementById('again').onclick=()=>{noCount=0;renderStart()};
burst();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function burst(){
const box=document.getElementById('confetti');
for(let i=0;i<70;i++){const e=document.createElement('i');e.className='piece';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.45+'s';e.style.transform='rotate('+Math.random()*360+'deg)';e.style.background=['#ff6fae','#ffd66b','#a98bff','#fff'][Math.floor(Math.random()*4)];box.appendChild(e);setTimeout(()=>e.remove(),3000)}
}
let timer;
function toggleMusic(){
if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
if(playing){clearInterval(timer);playing=false;musicBtn.textContent='♫';return}
playing=true;musicBtn.textContent='🔇';
const notes=[261.63,329.63,392,523.25,392,329.63];let i=0;
timer=setInterval(()=>{if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.32);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.34)},430)
}
musicBtn.onclick=toggleMusic; renderStart();
</script>
</body>
</html>
